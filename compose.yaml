# Avvio: docker compose up -d --build   →   http://127.0.0.1:8000
# Ollama NON è qui: gira nativo sull'host (GPU). I dati stanno in RAG_DATA_DIR sull'host.
services:
  rag:
    build: .
    image: haiku-local-rag:latest
    container_name: haiku-rag
    restart: unless-stopped
    ports:
      - "127.0.0.1:${RAG_PORT:-8000}:8000"   # solo locale
    volumes:
      - ${RAG_DATA_DIR:-~/haiku-rag-data}:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      OMP_NUM_THREADS: ${RAG_THREADS:-2}
    # Tetto alle risorse: l'ingestion (Docling/OCR) non può saturare la macchina
    deploy:
      resources:
        limits:
          cpus: "${RAG_CPUS:-4}"
          memory: ${RAG_MEMORY:-4500m}
