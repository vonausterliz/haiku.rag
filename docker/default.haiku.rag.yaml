# Configurazione di default del container: copiata in /data/config al primo avvio, poi gestita dalla pagina Admin
# Chiavi verificate sulla documentazione ufficiale: https://ggozad.github.io/haiku.rag/configuration/
environment: production

providers:
  ollama:
    base_url: http://host.docker.internal:11434   # Ollama nativo sull'host (GPU Metal)

embeddings:
  model:
    provider: ollama
    name: qwen3-embedding:4b
    vector_dim: 2560
  batch_size: 32          # basso di proposito: ingestion "gentile" (default upstream 512)

qa:
  model:
    provider: ollama
    name: qwen3.6:35b-a3b
    temperature: 0.3
    max_tokens: 1500
    thinking: false

# Reranker disattivato nel container: il cross-encoder gira su CPU (niente GPU in Docker su macOS)
# e costa minuti per domanda. Attivabile da Admin (es. BAAI/bge-reranker-v2-m3) su host con GPU NVIDIA.
reranking: {}

processing:
  chunk_size: 384
  chunker: docling-local
  chunker_type: hybrid
  chunking_tokenizer: "Qwen/Qwen3-Embedding-0.6B"   # stesso tokenizer della famiglia embedder
  chunking_merge_peers: true
  chunking_use_markdown_tables: true
  converter: docling-local
  split_pages: 10
  conversion_timeout: 900
  extract_pdf_attachments: true
  pictures: description
  min_picture_size: 64
  conversion_options:
    pdf_backend: docling_parse
    do_ocr: true
    force_ocr: false
    ocr_engine: tesseract              # nel container (Linux) ocrmac non esiste
    ocr_lang: ["ita", "eng"]
    do_table_structure: true
    table_mode: accurate
    images_scale: 2.0
    generate_page_images: false        # risparmio RAM/disco
    picture_description:
      model:
        provider: ollama
        name: qwen3-vl:8b-instruct
        thinking: false
      timeout: 180
      max_tokens: 700                  # descrizioni precise (default upstream 200)

lancedb:
  databases:
    default: /data/corpora/default.lancedb

prompts:
  picture_description: >-
    Descrivi questa immagine in italiano, in modo preciso ed esaustivo. Indica il tipo di immagine
    (foto, grafico, diagramma, tabella, mappa, screenshot, scansione, logo). Trascrivi parola per parola
    TUTTO il testo visibile, nella sua lingua originale. Per grafici e tabelle riporta assi, etichette,
    unità di misura e tutti i valori leggibili. Per i diagrammi descrivi componenti, relazioni e flussi.
    Non inventare nulla che non sia visibile.
